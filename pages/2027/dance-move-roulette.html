<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dance Move Roulette</title>
<style>
:root{--pink:#ff39d5;--cyan:#2eeaff;--lime:#7cff3a;--yellow:#ffe44d;--purple:#a85cff;--orange:#ff9f31}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#17133d 0,#070713 40%,#020207 75%);color:white;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
.wrap{max-width:820px;margin:auto;padding:28px 18px 44px;text-align:center}
.kicker{letter-spacing:.18em;color:var(--cyan);font-weight:800;font-size:.85rem}
h1{margin:5px 0 0;font-size:clamp(2.7rem,10vw,5.8rem);line-height:.9;text-transform:uppercase;text-shadow:0 0 8px currentColor,0 0 24px currentColor}
h1 span:nth-child(1){color:var(--pink)} h1 span:nth-child(2){color:var(--cyan)}
.sub{margin:14px 0 25px;color:#fff59a;font-size:clamp(1rem,3.7vw,1.35rem)}
.machine{position:relative;border:3px solid var(--purple);border-radius:28px;padding:26px 18px;background:rgba(0,0,0,.62);box-shadow:0 0 18px var(--purple),inset 0 0 28px #36186b}
.label{color:var(--cyan);font-size:.85rem;letter-spacing:.16em;font-weight:bold}
#move{min-height:128px;display:flex;align-items:center;justify-content:center;font-size:clamp(2.5rem,10vw,5rem);font-weight:900;text-transform:uppercase;color:var(--lime);text-shadow:0 0 8px currentColor,0 0 28px currentColor;line-height:1}
#prompt{min-height:30px;margin-top:10px;font-size:1.1rem;color:#fff}
button{margin-top:25px;width:min(100%,420px);border:0;border-radius:999px;padding:18px 25px;font-size:1.25rem;font-weight:900;letter-spacing:.05em;color:#05050a;background:linear-gradient(90deg,var(--pink),var(--yellow),var(--lime),var(--cyan));box-shadow:0 0 18px #ff39d5,0 0 28px #2eeaff;cursor:pointer}
button:active{transform:scale(.97)}
.countdown{height:34px;margin-top:16px;color:var(--yellow);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:28px}
.chip{padding:10px 6px;border:1px solid #ffffff55;border-radius:12px;font-size:.78rem;color:#ddd;background:#ffffff08}
.footer{margin-top:28px;color:var(--pink);font-weight:800;letter-spacing:.08em}
.spark{position:fixed;width:5px;height:5px;border-radius:50%;pointer-events:none;animation:pop .8s ease-out forwards;box-shadow:0 0 9px currentColor}
@keyframes pop{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<style>
.site-hubbar{position:relative;z-index:2147483647;display:flex;align-items:center;gap:.6rem;
  flex-wrap:wrap;padding:.55rem 1rem;background:#1d2a24;color:#f3e8d2;
  font:600 .82rem/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  letter-spacing:.02em;border-bottom:2px solid #c8a24a;box-sizing:border-box}
.site-hubbar a{color:#f3e8d2;text-decoration:none;border-bottom:1px solid transparent;padding-bottom:1px}
.site-hubbar a:hover,.site-hubbar a:focus{border-bottom-color:#c8a24a;color:#fff}
.site-hubbar .sep{color:#7e8b82}
.site-hubbar .here{color:#c8a24a}
</style>
<div class="site-hubbar">
  <a href="../../index.html">&#8592; Glave Family Happenings</a>
  <span class="sep">/</span>
  <a href="../../year.html?y=2027">2027</a>
  <span class="sep">/</span>
  <span class="here">Dance Move Roulette</span>
</div>

<div class="wrap">
<div class="kicker">GLOW INTO THE NEW YEAR • 2027</div>
<h1><span>DANCE MOVE</span><br><span>ROULETTE</span></h1>
<div class="sub">Tap the button. Everyone does the move for 20–30 seconds!</div>

<div class="machine">
  <div class="label">YOUR MOVE IS...</div>
  <div id="move">READY?</div>
  <div id="prompt">No right moves. Just good vibes.</div>
</div>

<button id="spin">⚡ PICK A DANCE MOVE ⚡</button>
<div class="countdown" id="timer"></div>

<div class="grid" id="moves"></div>
<div class="footer">GAME ON • GLOW ON • COUNTDOWN TO 2027</div>
</div>

<script>
const dances=[
["THE ROBOT","Beep boop! Move like a robot."],
["DISCO FEVER","Point, strut and shine!"],
["THE SPRINKLER","Swing those arms like a sprinkler!"],
["AIR GUITAR","Channel your inner rock star!"],
["CHICKEN DANCE","Flap, flap, cluck, cluck!"],
["RUNNING MAN","Run in place and groove!"],
["THE WORM","Get low and keep going!"],
["MACARENA","You know the moves!"],
["THE TWIST","Twist it out!"],
["NAE NAE","Now watch me!"],
["SLOW MOTION","Everything in sloooow motion."],
["THE SHUFFLE","Side to side, keep it smooth!"],
["CHA CHA SLIDE","Slide left, slide right!"],
["SALSA SHINE","Shake those hips!"],
["THRILLER","Channel your inner zombie!"],
["THE FLOSS","Front, back, front, back!"],
["COWBOY","Tip your hat and two-step!"],
["FREESTYLE","Your move. Your rules!"]
];
let last=-1, rolling=false;
const move=document.getElementById("move"), prompt=document.getElementById("prompt"),
spin=document.getElementById("spin"), timer=document.getElementById("timer");
document.getElementById("moves").innerHTML=dances.map(d=>`<div class="chip">${d[0]}</div>`).join("");

function sparks(){
 const colors=["#ff39d5","#2eeaff","#7cff3a","#ffe44d","#a85cff","#ff9f31"];
 for(let i=0;i<28;i++){
  const s=document.createElement("i"); s.className="spark";
  s.style.left="50%";s.style.top="45%";s.style.color=colors[i%colors.length];
  s.style.background="currentColor";
  s.style.setProperty("--x",(Math.random()*500-250)+"px");
  s.style.setProperty("--y",(Math.random()*360-180)+"px");
  document.body.appendChild(s); setTimeout(()=>s.remove(),850);
 }
}
function choose(){
 if(rolling)return; rolling=true; timer.textContent="";
 let ticks=0;
 const r=setInterval(()=>{
   const x=Math.floor(Math.random()*dances.length);
   move.textContent=dances[x][0]; prompt.textContent="🎵 Spin... spin... spin...";
   ticks++;
   if(ticks>13){
    clearInterval(r);
    let pick; do{pick=Math.floor(Math.random()*dances.length)}while(pick===last);
    last=pick; move.textContent=dances[pick][0]; prompt.textContent=dances[pick][1];
    sparks(); rolling=false;
    timer.textContent="🔥 EVERYBODY MOVE! 20–30 SECONDS!";
   }
 },85);
}
spin.addEventListener("click",choose);
</script>
</body>
</html>
